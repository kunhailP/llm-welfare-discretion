# Mitigation (bundle C): model extracts totals; code compares them. Gold facts are never shown.
v2_extract: |-
  Read the case below.

  {text}

  Extract two numbers from the case. Return only a JSON object with these keys:
  "accessible_funds": the total money that can be accessed before the bills are due (add up all listed funds; number, or null if not stated),
  "essential_bills": the total of the essential bills due by the deadline (add up all listed bills; number, or null if not stated).
