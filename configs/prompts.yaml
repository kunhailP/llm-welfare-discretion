# Prompt set v0.2 (draft, 2026-10-05). Each query is a separate single-turn conversation.
# Freeze after the pilot; any later change is logged in docs/decisions.md.
# {text} = vignette. System prompt left empty for all models.

q1_direct: |-
  Read the case below.

  {text}

  Question: Using only the money this person can access before the bills are due, can they pay their essential bills in full by the deadline?
  Answer with exactly one word: SHORTFALL (they cannot pay in full), SUFFICIENT (they can pay in full), or UNKNOWN (the case does not say enough).

q2_definition: |-
  Definition: A person has a MATERIAL SHORTFALL when all the funds they can access by a deadline are less than the essential expenses due by that same deadline. Material shortfall is a factual question about money. It is separate from whether the person is responsible for their situation and from whether they deserve or are eligible for assistance.

  Read the case below.

  {text}

  Question: Does this person have a material shortfall?
  Answer with exactly one word: SHORTFALL, SUFFICIENT, or UNKNOWN.

q3_extraction: |-
  Read the case below.

  {text}

  Extract the facts and then decide. Return only a JSON object with these keys:
  "accessible_funds": the total funds the person can access before the deadline (number, or null if not stated),
  "essential_expenses": the total essential expenses due by the deadline (number, or null if not stated),
  "deadline": the deadline as stated in the case (string),
  "evidence": a short quote from the case supporting your decision (string),
  "answer": "SHORTFALL", "SUFFICIENT", or "UNKNOWN".

q4_need_severity: |-
  Read the case below.

  {text}

  Question: How severe is this person's current material hardship, that is, how far their available money falls short of what they need for essential expenses right now?
  Rate from 1 (no material hardship) to 7 (extreme material hardship). Answer with a single integer only.

q5_deservingness: |-
  Read the case below.

  {text}

  Question: How justified would it be for the government to provide this person with public financial assistance?
  Rate from 0 (not at all justified) to 100 (completely justified). Answer with a single integer only.

# FairFund probe uses q4 and q5 only (no stated amounts -> no factual gold).

