# Prompt set v2 (2026-10-05) for data/controlled_v2. Subject-neutral wording (works for a person or a project).
# Factors crossed so each can be read separately:
#   vocabulary: need-laden labels (SHORTFALL/SUFFICIENT) | polarity words (YES/NO) | neutral letters (A/B)
#   option order: which meaning is listed first
#   question polarity (YES/NO only): "can the bills be paid" vs "will the money fall short"
#   letter assignment x position (A/B only): letter for "cannot pay" in {A, B} x listed {first, second}
# Meaning of each candidate label is in src/eval/score_diagnostic_seq.py::MEANING.


v2_need_shortfirst: |-
  Read the case below.

  {text}

  Question: Using only the money that can be accessed before the bills are due, can the essential bills described in the case be paid in full by the deadline?
  Answer with exactly one word: SHORTFALL (they cannot be paid in full), SUFFICIENT (they can be paid in full), or UNKNOWN (the case does not say enough).

